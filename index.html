<style>
    /* Reset CSS */
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: 'Plus Jakarta Sans', sans-serif;
        background: linear-gradient(180deg, #f8f9ff 0%, #f3f5fd 100%);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
        color: #333333;
    }

    /* Container */
    .login-container {
        width: 100%;
        max-width: 420px;
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    /* Logo & Tagline */
    .brand-header {
        text-align: center;
        margin-bottom: 24px;
    }

    .logo {
        font-family: 'Merriweather', Georgia, serif;
        font-size: 42px;
        font-weight: 700;
        color: #3b2bee;
        letter-spacing: -0.5px;
        margin-bottom: 8px;
    }

    .tagline {
        font-family: 'Merriweather', Georgia, serif;
        font-size: 14px;
        color: #555555;
    }

    /* Login Card Box */
    .login-card {
        background-color: #ffffff;
        width: 100%;
        padding: 32px 28px;
        border-radius: 16px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04);
        border: 1px solid #e8ecf4;
    }

    .card-title {
        font-family: 'Merriweather', Georgia, serif;
        font-size: 22px;
        font-weight: 700;
        color: #111827;
        margin-bottom: 24px;
    }

    /* Form */
    .login-form {
        display: flex;
        flex-direction: column;
        gap: 20px;
    }

    .form-group {
        display: flex;
        flex-direction: column;
        gap: 8px;
    }

    .form-group label {
        font-size: 13px;
        font-weight: 700;
        color: #374151;
    }

    .label-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .forgot-pass {
        font-size: 12px;
        color: #4338ca;
        text-decoration: none;
        font-weight: 500;
    }

    .forgot-pass:hover {
        text-decoration: underline;
    }

    /* Input Fields */
    .input-wrapper {
        position: relative;
        display: flex;
        align-items: center;
    }

    .input-icon {
        position: absolute;
        left: 14px;
        color: #9ca3af;
        font-size: 16px;
    }

    .toggle-password {
        position: absolute;
        right: 14px;
        color: #9ca3af;
        font-size: 16px;
        cursor: pointer;
    }

    .input-wrapper input {
        width: 100%;
        padding: 12px 14px 12px 42px;
        border: 1px solid #e5e7eb;
        border-radius: 10px;
        font-size: 14px;
        color: #1f2937;
        background-color: #fafafa;
        outline: none;
        transition: all 0.2s ease;
    }

    .input-wrapper input::placeholder {
        color: #9ca3af;
    }

    .input-wrapper input:focus {
        border-color: #4338ca;
        background-color: #ffffff;
        box-shadow: 0 0 0 3px rgba(67, 56, 202, 0.1);
    }

    /* Submit Button */
    .btn-submit {
        margin-top: 4px;
        width: 100%;
        padding: 13px;
        background-color: #2b26c7;
        color: #ffffff;
        border: none;
        border-radius: 10px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: background-color 0.2s ease;
    }

    .btn-submit:hover {
        background-color: #1e1aa8;
    }

    /* Divider */
    .divider {
        position: relative;
        text-align: center;
        margin: 24px 0;
    }

    .divider::before {
        content: "";
        position: absolute;
        top: 50%;
        left: 0;
        width: 100%;
        height: 1px;
        background-color: #e5e7eb;
    }

    .divider span {
        position: relative;
        background-color: #ffffff;
        padding: 0 12px;
        font-size: 13px;
        color: #9ca3af;
    }

    /* Register Footer */
    .register-footer {
        text-align: center;
        font-size: 13px;
        color: #4b5563;
    }

    .register-link {
        color: #2b26c7;
        font-weight: 700;
        text-decoration: none;
    }

    .register-link:hover {
        text-decoration: underline;
    }
</style>


<div class="login-container">
    <!-- Logo -->
    <div class="brand-header">
        <h1 class="logo">Examly</h1>
        <p class="tagline">Nền tảng đánh giá giáo dục chuyên nghiệp</p>
    </div>

    <!-- Login Card -->
    <div class="login-card">
        <h2 class="card-title">Đăng nhập</h2>

        <form class="login-form" action="#">
            <!-- Input Email -->
            <div class="form-group">
                <label for="email">Email</label>
                <div class="input-wrapper">
                    <i class="fa-regular fa-envelope input-icon"></i>
                    <input type="email" id="email" placeholder="nhap@email.com" required>
                </div>
            </div>

            <!-- Input Password -->
            <div class="form-group">
                <div class="label-row">
                    <label for="password">Mật khẩu</label>
                    <a href="#" class="forgot-pass">Quên mật khẩu?</a>
                </div>
                <div class="input-wrapper">
                    <i class="fa-solid fa-lock input-icon"></i>
                    <input type="password" id="password" placeholder="••••••••" required>
                    <i class="fa-regular fa-eye toggle-password"></i>
                </div>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="btn-submit">Đăng nhập</button>
        </form>

        <!-- Divider -->
        <div class="divider">
            <span>Hoặc</span>
        </div>

        <!-- Register Link -->
        <div class="register-footer">
            <span>Chưa có tài khoản? </span>
            <a href="#" class="register-link">Đăng ký tài khoản mới</a>
        </div>
    </div>
</div>
