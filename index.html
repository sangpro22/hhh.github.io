<div class="login-container">
    <!-- Header / Logo Area -->
    <div class="brand-header">
        <h1 class="logo">Examly</h1>
        <p class="tagline">Nền tảng đánh giá giáo dục chuyên nghiệp</p>
    </div>

    <!-- Login Form Card -->
    <div class="login-card">
        <h2 class="card-title">Đăng nhập</h2>

        <form class="login-form" action="#">
            <!-- Input Email -->
            <div class="form-group">
                <label for="email">Email</label>
                <div class="input-wrapper">
                    <i class="fa-regular fa-envelope input-icon"></i>
                    <input type="email" id="email" placeholder="nhap@email.com" required>
                </div>
            </div>

            <!-- Input Password -->
            <div class="form-group">
                <div class="label-row">
                    <label for="password">Mật khẩu</label>
                    <a href="#" class="forgot-pass">Quên mật khẩu?</a>
                </div>
                <div class="input-wrapper">
                    <i class="fa-solid fa-lock input-icon"></i>
                    <input type="password" id="password" placeholder="••••••••" required>
                    <i class="fa-regular fa-eye toggle-password"></i>
                </div>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="btn-submit">Đăng nhập</button>
        </form>

        <!-- Divider -->
        <div class="divider">
            <span>Hoặc</span>
        </div>

        <!-- Register Link -->
        <div class="register-footer">
            <span>Chưa có tài khoản? </span>
            <a href="#" class="register-link">Đăng ký tài khoản mới</a>
        </div>
    </div>
</div>
