<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hồ Hoài Sang - Personal Website</title>
    <!-- Import phông chữ Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* CSS Reset & Cấu hình chung */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            line-height: 1.6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Khung thẻ thông tin chính */
        .card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
            text-align: center;
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        /* Avatar giả lập / Khung ảnh */
        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px auto;
            font-size: 36px;
            font-weight: 700;
            color: #ffffff;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.4);
        }

        /* Tiêu đề & Tên */
        h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
            background: linear-gradient(to right, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            color: #94a3b8;
            font-size: 15px;
            margin-bottom: 20px;
        }

        .bio {
            color: #cbd5e1;
            font-size: 14px;
            margin-bottom: 30px;
        }

        /* Danh sách liên kết / Nút bấm */
        .links {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            display: block;
            padding: 12px 20px;
            border-radius: 8px;
            background-color: #334155;
            color: #f8fafc;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.2s ease;
            border: 1px solid transparent;
        }

        .btn:hover {
            background-color: #3b82f6;
            color: #ffffff;
            border-color: #60a5fa;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }

        /* Footer nhỏ */
        footer {
            margin-top: 30px;
            font-size: 12px;
            color: #64748b;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Chữ cái đại diện avatar -->
        <div class="avatar">S</div>
        
        <!-- Tên cá nhân -->
        <h1>Hồ Hoài Sang</h1>
        <p class="subtitle">Developer / Student</p>
        
        <p class="bio">
            Chào mừng bạn đến với trang web cá nhân của tôi!
        </p>

        <!-- Các liên kết mạng xã hội / dự án -->
        <div class="links">
            <a href="https://github.com/sangpro22" target="_blank" class="btn">GitHub Profile</a>
            <a href="mailto:example@gmail.com" class="btn">Gửi Email Liên Hệ</a>
        </div>

        <footer>
            © 2026 Hồ Hoài Sang. Hosted on GitHub Pages.
        </footer>
    </div>

</body>
</html>
